name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  tasks: build }
          - { os: windows-latest, tasks: jvmTest mingwX64Test }
          - { os: macos-latest,   tasks: jvmTest macosArm64Test }
    env:
      MICROSOFT_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same Gradle cache provider as the release packaging jobs, so main's cache is the one they restore
      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v3.0.0-dev-202610091014
        with:
          java-version: '25'
          packaging-tools: 'false'

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: konan
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} --continue --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx6G -Dfile.encoding=UTF-8"

      # Only main's caches are visible to other refs: a PR or tag save would just evict them
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always() && github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-reports-${{ runner.os }}
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
