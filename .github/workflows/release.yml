name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      release-type: ${{ steps.version.outputs.release-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate the tag was cut from main
        uses: NucleusFramework/Nucleus/.github/actions/validate-release-ref@v3.0.0-dev-202610102114
        with:
          prerelease-branch: main
          prerelease-tag-regex: '^v.*$'

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-qualifier]"
            exit 1
          fi
          case "$VERSION" in
            *-alpha*) CHANNEL=alpha; TYPE=prerelease ;;
            *-beta*)  CHANNEL=beta;  TYPE=prerelease ;;
            *)        CHANNEL=latest; TYPE=release ;;
          esac
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "release-type=$TYPE"
          } >> "$GITHUB_OUTPUT"

  # The tag is on main, so main's own Build run for this commit is reused instead of testing it twice. Missing or
  # cancelled runs are replaced by dispatching build.yml rather than a conditional reusable-workflow job: a skipped
  # job would skip every job downstream of it, even ones that don't list it in `needs`
  test:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          find_run() {
            gh run list --workflow build.yml --event "$1" --commit "$GITHUB_SHA" --limit 20 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$2\")][0].databaseId // empty"
          }
          await_run() {
            local event="$1" since="${2:-}" id=""
            for _ in $(seq 12); do
              id="$(find_run "$event" "$since")"
              [ -n "$id" ] && break
              sleep 10
            done
            [ -n "$id" ] || return 0
            echo "Waiting for Build run $id ($event)" >&2
            gh run watch "$id" --interval 30 > /dev/null || true
            gh run view "$id" --json conclusion --jq .conclusion
          }
          # A main+tag push starts both workflows at once, so main's run may not be registered yet
          CONCLUSION="$(await_run push)"
          case "$CONCLUSION" in
            success) exit 0 ;;
            failure|timed_out) echo "::error::main Build run for $GITHUB_SHA concluded '$CONCLUSION'"; exit 1 ;;
          esac
          echo "No usable main Build run for $GITHUB_SHA ('${CONCLUSION:-none}'); dispatching one on $GITHUB_REF_NAME"
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"
          CONCLUSION="$(await_run workflow_dispatch "$DISPATCHED_AT")"
          if [ "$CONCLUSION" != success ]; then
            echo "::error::Dispatched Build run concluded '${CONCLUSION:-not found}'"
            exit 1
          fi

  gui:
    name: GUI (${{ matrix.os }} / ${{ matrix.arch }})
    needs: [ version, test ]
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest,   arch: amd64 }
          - { os: windows-11-arm,   arch: arm64 }
          - { os: macos-latest,     arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v3.0.0-dev-202610102114
        with:
          java-version: '25'
          flatpak: 'true'
          snap: 'true'

      - name: Configure Linux GPG signing
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "::warning::No LINUX_GPG_PRIVATE_KEY secret set; Linux packages will be unsigned."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/nucleus-signing-key.asc"
          (umask 077; printf '%s' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE")
          {
            echo "compose.desktop.linux.sign=true"
            echo "compose.desktop.linux.signing.keyId=$LINUX_GPG_KEY_ID"
            echo "compose.desktop.linux.signing.keyFile=$KEY_FILE"
            echo "compose.desktop.linux.signing.passphrase=$LINUX_GPG_PASSPHRASE"
            echo "compose.desktop.linux.signing.silentUpdate=true"
          } >> gradle.properties

      - name: Build packages
        shell: bash
        run: >
          ./gradlew :app:launcher-gui:packageReleaseDistributionForCurrentOS
          -PappVersion=${{ needs.version.outputs.version }}
          --stacktrace --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: packaging-logs-${{ runner.os }}-${{ matrix.arch }}
          path: app/launcher-gui/build/compose/logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch }}
          path: |
            app/launcher-gui/build/compose/binaries/**/*.deb
            app/launcher-gui/build/compose/binaries/**/*.rpm
            app/launcher-gui/build/compose/binaries/**/*.asc
            app/launcher-gui/build/compose/binaries/**/*.pacman
            app/launcher-gui/build/compose/binaries/**/*.snap
            app/launcher-gui/build/compose/binaries/**/*.flatpak
            app/launcher-gui/build/compose/binaries/**/*.AppImage
            app/launcher-gui/build/compose/binaries/**/*.msi
            app/launcher-gui/build/compose/binaries/**/*.exe
            app/launcher-gui/build/compose/binaries/**/*.appx
            app/launcher-gui/build/compose/binaries/**/*.pkg
            app/launcher-gui/build/compose/binaries/**/*.dmg
            app/launcher-gui/build/compose/binaries/**/*.zip
            app/launcher-gui/build/compose/binaries/**/*.tar
            app/launcher-gui/build/compose/binaries/**/*.tar.gz
            app/launcher-gui/build/compose/binaries/**/*.blockmap
            !app/launcher-gui/build/compose/binaries/**/runtime/**
            !app/launcher-gui/build/compose/binaries/**/app/**
          if-no-files-found: error

  # Artifacts here must not be named release-assets-*: generate-update-yml would list them in the GUI update feeds
  cli:
    name: CLI (${{ matrix.os }})
    needs: [ version, test ]
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: LinuxX64 LinuxArm64 MingwX64
          - os: macos-latest
            targets: MacosArm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v3.0.0-dev-202610102114
        with:
          java-version: '25'
          packaging-tools: 'false'

      # Restore only: a tag run's cache writes are invisible to later tags and just evict main's entries
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Link release executables
        shell: bash
        run: |
          set -euo pipefail
          TASKS=()
          for t in ${{ matrix.targets }}; do TASKS+=(":app:launcher-cli:linkReleaseExecutable$t"); done
          ./gradlew "${TASKS[@]}" -PappVersion=${{ needs.version.outputs.version }} --stacktrace --no-daemon

      - name: Archive executables
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          BIN=app/launcher-cli/build/bin
          mkdir -p out
          archive() {
            local target="$1" name="$2" exe="$3"
            local dir="$BIN/$target/releaseExecutable"
            if [[ "$exe" == *.exe ]]; then
              (cd "$dir" && zip -9 "$OLDPWD/out/vercors-cli-$VERSION-$name.zip" "$exe")
            else
              (cd "$dir" && cp "$exe" vercors && tar -czf "$OLDPWD/out/vercors-cli-$VERSION-$name.tar.gz" vercors)
            fi
          }
          for t in ${{ matrix.targets }}; do
            case "$t" in
              LinuxX64)   archive linuxX64   linux-x64     vercors.kexe ;;
              LinuxArm64) archive linuxArm64 linux-arm64   vercors.kexe ;;
              MingwX64)   archive mingwX64   windows-x64   vercors.exe ;;
              MacosArm64) archive macosArm64 macos-arm64   vercors.kexe ;;
            esac
          done
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  # Waits for the GUI and CLI builds so a failed release never leaves a pushed image without a GitHub Release
  meta:
    name: Meta image
    needs: [ version, gui, cli ]
    runs-on: ubuntu-latest
    environment: release
    env:
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v3.0.0-dev-202610102114
        with:
          java-version: '25'
          packaging-tools: 'false'

      - name: Publish image to Docker Hub
        env:
          ORG_GRADLE_PROJECT_dockerHubUsername: ${{ secrets.DOCKERHUB_USERNAME }}
          ORG_GRADLE_PROJECT_dockerHubPassword: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ./gradlew :app:meta:distribution:publishImage -PappVersion=${{ needs.version.outputs.version }} --stacktrace --no-daemon

  publish:
    name: Publish release
    needs: [ version, gui, cli, meta ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: release-assets-*

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: extra
          pattern: cli-*
          merge-multiple: true

      - uses: NucleusFramework/Nucleus/.github/actions/generate-update-yml@v3.0.0-dev-202610102114
        with:
          artifacts-path: artifacts
          version: ${{ needs.version.outputs.version }}
          channel: ${{ needs.version.outputs.channel }}

      - uses: NucleusFramework/Nucleus/.github/actions/publish-release@v3.0.0-dev-202610102114
        with:
          artifacts-path: artifacts
          tag: ${{ github.ref_name }}
          release-type: ${{ needs.version.outputs.release-type }}

      - name: Upload CLI archives
        run: gh release upload "${{ github.ref_name }}" extra/* --clobber
