when:
  - event: [ push, manual, pull_request ]
    branch: main

steps:
  build:
    image: eclipse-temurin:25-jdk@sha256:119a3d18f160a3e7655a66034d0f43beee31cd7b3b9142d57a5de29772011de6
    volumes:
      - vercors_gradle_cache:/root/.gradle
      - vercors_konan_cache:/root/.konan
    commands:
      - ./gradlew build --no-daemon --stacktrace
    environment:
      MICROSOFT_CLIENT_ID:
        from_secret: MICROSOFT_CLIENT_ID
