when:
  - event: [ push, manual, pull_request ]
    branch: main

steps:
  build:
    image: eclipse-temurin:25-jdk@sha256:010ab2b79329b951bf052dbf515843ab345ae4e4f0ef72287d85c9fa54da275f
    volumes:
      - vercors_gradle_cache:/root/.gradle
      - vercors_konan_cache:/root/.konan
    commands:
      - ./gradlew build --no-daemon --stacktrace
    environment:
      MICROSOFT_CLIENT_ID:
        from_secret: MICROSOFT_CLIENT_ID
