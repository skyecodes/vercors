when:
  - event: [ push, manual, pull_request ]
    branch: main

steps:
  build:
    image: eclipse-temurin:25-jdk@sha256:e787e08ef76f4c16866108cd7f9fcd96a68eef3ac6cc76866897d4d02d5a2262
    volumes:
      - vercors_gradle_cache:/root/.gradle
      - vercors_konan_cache:/root/.konan
    commands:
      - ./gradlew build --no-daemon --stacktrace
    environment:
      MICROSOFT_CLIENT_ID:
        from_secret: MICROSOFT_CLIENT_ID
