when:
  - event: [ push, manual, pull_request ]
    branch: main

steps:
  build:
    image: eclipse-temurin:25-jdk@sha256:8c0a84ea11c8f6ed52600fc19f1040121f2a162998e9f50a5faebbbad9172dcc
    volumes:
      - vercors_gradle_cache:/root/.gradle
      - vercors_konan_cache:/root/.konan
    commands:
      - ./gradlew build --no-daemon --stacktrace
    environment:
      MICROSOFT_CLIENT_ID:
        from_secret: MICROSOFT_CLIENT_ID
