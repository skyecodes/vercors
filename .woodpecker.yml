when:
  - event: [ push, manual, pull_request ]
    branch: main

steps:
  build:
    image: eclipse-temurin:25-jdk@sha256:97014c4b396021f9ddb7d592a7dbedb0c4e4215c29e03dc01c393558aefb71c2
    volumes:
      - vercors_gradle_cache:/root/.gradle
      - vercors_konan_cache:/root/.konan
    commands:
      - ./gradlew build --no-daemon --stacktrace
    environment:
      MICROSOFT_CLIENT_ID:
        from_secret: MICROSOFT_CLIENT_ID
